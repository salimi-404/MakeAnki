<div class="card-container">

    <div class="tag-badge">{{Tags}}</div>

    <div class="card-type-label">
        Deutsch ➔ Persisch
    </div>

    <div class="full-word">
        {{FullWord}}
        <span class="audio-btn">{{WordAudio}}</span>
    </div>

    {{#Plural}}
    <div class="plural-box">
        {{Plural}}
    </div>
    {{/Plural}}

    <hr>

    <div class="meaning">
        {{Meaning}}
    </div>

    <div class="example-box">
        <div class="ex-de">
            {{Example_DE}}
            <span class="audio-btn">{{ExampleAudio}}</span>
        </div>

        <div class="ex-fa">
            {{Example_FA}}
        </div>
    </div>

    <div class="grammar-badge">
        {{Grammar}}
    </div>

</div>
